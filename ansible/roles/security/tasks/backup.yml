---
- name: Vérifier le mot de passe restic
  ansible.builtin.assert:
    that:
      - security_backup_restic_password | length > 0
    fail_msg: "security_backup_restic_password vide. Définis-le via vault."

- name: Installer restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true

- name: Créer le dossier du dépôt
  ansible.builtin.file:
    path: "{{ security_backup_repo_path }}"
    state: directory
    mode: "0700"

- name: Fichier d'environnement restic
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Initialiser le dépôt restic (une fois)
  ansible.builtin.shell: |
    set -a; . /etc/restic.env; set +a
    restic snapshots >/dev/null 2>&1 || restic init
  args:
    executable: /bin/bash
  register: _restic_init
  changed_when: "'created restic repository' in _restic_init.stdout"

- name: Script de backup
  ansible.builtin.template:
    src: run-backup.sh.j2
    dest: /usr/local/bin/run-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Service systemd de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Backup restic
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/run-backup.sh

- name: Timer systemd de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Backup restic quotidien

      [Timer]
      OnCalendar={{ security_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Activer le timer
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
    daemon_reload: true
