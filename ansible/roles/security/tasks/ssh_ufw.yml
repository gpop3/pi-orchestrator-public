---
- name: Installer UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: SSH durci (drop-in)
  ansible.builtin.template:
    src: 60-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Valider la configuration sshd complète
  ansible.builtin.command: sshd -t
  register: _sshd_check
  changed_when: false
  failed_when: false

- name: Retirer le drop-in si la conf sshd est invalide
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/60-hardening.conf
    state: absent
  when: _sshd_check.rc != 0

- name: Échouer proprement si la conf sshd invalide
  ansible.builtin.fail:
    msg: "sshd_config invalide, drop-in retiré (aucun reload). Détail : {{ _sshd_check.stderr }}"
  when: _sshd_check.rc != 0

- name: UFW - politiques par défaut
  community.general.ufw:
    direction: "{{ item.dir }}"
    policy: "{{ item.pol }}"
  loop:
    - { dir: incoming, pol: deny }
    - { dir: outgoing, pol: allow }

- name: UFW - port bastion depuis le tailnet
  community.general.ufw:
    rule: allow
    port: "{{ security_bastion_ssh_port }}"
    proto: tcp
    interface: "{{ security_tailscale_iface }}"
    direction: in

- name: UFW - SSH hôte seulement depuis le bastion (docker)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ security_docker_subnet }}"

- name: UFW - tout autoriser depuis le LAN (zone de confiance)
  community.general.ufw:
    rule: allow
    src: "{{ security_lan_subnet }}"

- name: UFW - autoriser le réseau Docker à joindre HA sur l'hôte
  community.general.ufw:
    rule: allow
    port: "{{ security_ha_port }}"
    proto: tcp
    src: "{{ security_docker_subnet }}"

- name: UFW - bloquer SSH hôte direct depuis le tailnet
  community.general.ufw:
    rule: deny
    port: "22"
    proto: tcp
    interface: "{{ security_tailscale_iface }}"
    direction: in

- name: UFW - activer
  community.general.ufw:
    state: enabled
